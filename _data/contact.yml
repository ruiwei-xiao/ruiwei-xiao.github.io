# 首页 Contact 版块。
# endpoint：表单服务（如 Formspree）的提交地址；邮箱不会出现在网页上。留空时，按钮改为"复制消息并打开 LinkedIn"。
# roles：可选的联系类型。field1 / field2 是这个类型专属的两个输入框；label 同时是发到收件箱里的字段名。
endpoint: ""
linkedin: https://linkedin.com/in/rx98
roles:
  - key: research
    label: Research collaboration
    text: Studies, co-authored work, or shared classrooms and data
    field1: { label: "Institution", placeholder: "University or lab" }
    field2: { label: "Research area", placeholder: "Topic or project" }
    message: "What would you like to work on together?"
  - key: media
    label: Media coverage
    text: Interviews, articles, and press inquiries
    field1: { label: "Outlet", placeholder: "Publication or program" }
    field2: { label: "Deadline", placeholder: "When you need a response" }
    message: "What is the story, and what would you like to ask?"
  - key: talk
    label: Invited talks
    text: Keynotes, panels, seminars, and workshops
    field1: { label: "Event or host", placeholder: "Conference, school, or organization" }
    field2: { label: "Date and format", placeholder: "In person or online" }
    message: "Who is the audience, and what topic do you have in mind?"
  - key: consulting
    label: AI literacy course consulting
    text: Designing or reviewing AI literacy curricula
    field1: { label: "Organization", placeholder: "School, district, or company" }
    field2: { label: "Learners", placeholder: "Who they are and how many" }
    message: "What are you hoping to build or improve?"

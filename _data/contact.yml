# 首页 Contact 版块：选来意 + 感兴趣的项目，自动生成一封可编辑的邮件（收件人在 _config.yml 的 contact_email）。
# 模板里的占位符：{name} 名字、{from} "from 机构"（没填机构就是空）、{projects} 选中的项目（没选就是 "AI literacy education"）。
# 方括号里的内容是留给对方自己改的提示。
categories:
  - key: research
    label: Research collaboration
    subject: "Research collaboration: {projects}"
    body: |
      Hi Ruiwei,

      I'm {name}{from}. I came across your work on {projects} and would love to explore a research collaboration.

      [A few sentences about your research and the collaboration you have in mind]

      Would you be open to a short call in the coming weeks?

      Best,
      {name}
  - key: media
    label: Media & interviews
    subject: "Interview request: {projects}"
    body: |
      Hi Ruiwei,

      I'm {name}{from}. I'm working on a story about [topic] and would love to interview you about {projects}.

      [Outlet, format (written, podcast, video), and your deadline]

      Let me know if you'd be available, and what times work for you.

      Best,
      {name}
  - key: educator
    label: Educators
    subject: "Bringing {projects} to my students"
    body: |
      Hi Ruiwei,

      I'm {name}{from}. I teach [grade level / subject] and I'm interested in bringing {projects} to my students.

      [How many students, your timeline, and any questions you have]

      Could you share how I can get started?

      Best,
      {name}
  - key: investor
    label: Investors
    subject: "ActiveAI: {projects}"
    body: |
      Hi Ruiwei,

      I'm {name}{from}. I've been following ActiveAI and your work on {projects}, and I'd like to learn more about where you're taking it.

      [Your fund or focus area, and what you'd like to discuss]

      Would you be open to a short intro call?

      Best,
      {name}
  - key: other
    label: Something else
    subject: "Hello from {name}"
    body: |
      Hi Ruiwei,

      I'm {name}{from}. I'm reaching out about {projects}.

      [Your message]

      Best,
      {name}

projects:
  - ActiveAI K–12 modules
  - Pedagogical Prompting
  - AI for Learning course
  - AI World Park
  - AI Literacy for All workshop
  - Research papers

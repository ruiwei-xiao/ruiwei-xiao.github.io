# Learning Design 版块：和 Publications 一样的左右布局。每个受众一块；
# modules 按 AILF 四个能力分组，soon: true 表示 Coming soon（默认折叠，点 "Show all" 展开）。
# 没有 modules 的受众右侧只显示 Coming soon。lessons：该受众的课节数（目前没有显示）。
# modules 清单显示在首页 List view 里。chip：左侧标签文字（默认取组名第一个词）；meta：描述后的小字；link：单条链接（默认用受众的 link）。
audiences:
  - name: K–12
    side: ActiveAI
    lessons: 19
    text: "19 interactive modules across the four competencies, mapped to the OECD/EC AI Literacy Framework."
    link: https://app.active-ai.io/hour_of_ai
    link_label: Try Hour of AI
    groups:
      - key: engage
        name: Engage with AI
        modules:
          - title: "AI Around You: How Does AI Do It?"
            text: "Recognize the roles and effects of AI in different contexts"
          - title: "Are language models just playing word prediction?"
            text: "Accurately explain how an AI system performs a task"
          - title: "How do AI agents work and get debugged?"
            text: "Evaluate whether to accept, revise, or reject AI output"
          - title: "Why did TikTok recommend this? Understanding recommender effects"
            text: "Examine how predictive AI suggestions expand or limit perspectives"
          - title: "Does AI need water? Comparing its energy and resource use"
            text: "Compare AI systems' consumption of energy and natural resources"
            soon: true
          - title: "Can AI amplify bias?"
            text: "Explain how AI can amplify social bias"
            soon: true
          - title: "Is this an ethical use of AI?"
            text: "Analyze whether AI use aligns with ethical principles and human values"
            soon: true
      - key: create
        name: Create with AI
        modules:
          - title: "Use AI to make your own idea better"
            text: "Use AI to explore new perspectives and approaches built on original ideas"
          - title: "Bring an idea to life with different AI tools"
            text: "Use different types of AI to visualize, prototype, and combine ideas"
          - title: "Make AI your coach"
            text: "Guide generative AI to give feedback, improve work, and support reflection"
            soon: true
          - title: "Does this count as plagiarism?"
            text: "Analyze how AI protects or harms authenticity and intellectual property"
            soon: true
      - key: manage
        name: Manage AI
        modules:
          - title: "How Can AI Help You Learn?"
            text: "Decide whether to use AI based on the nature of a task"
          - title: "Which AI fits the task? Choosing the right approach"
            text: "Compare how AI systems work and choose an appropriate approach"
            soon: true
          - title: "Which steps should go to AI? Decompose the task first"
            text: "Decompose problems and decide when and how AI should automate or assist"
          - title: "Are we using AI well? Check as you go"
            text: "Continuously monitor and evaluate AI use during problem solving"
            soon: true
      - key: shape
        name: Shape AI
        modules:
          - title: "How does image-generating AI work?"
            text: "Investigate an AI system's intended behavior, users, and limitations"
          - title: "Is this AI ready to launch? Be an AI quality reviewer"
            text: "Evaluate AI using criteria, expected outcomes, tests, and user feedback"
            soon: true
          - title: "Why can your phone auto-tag photos? Bias in machine learning"
            text: "Examine how data sources, choices, and information flow affect AI output"
          - title: "Make AI better"
            text: "Improve AI systems to advance human well-being and social good"
            soon: true
      - key: assess
        name: Assessment
        chip: Game
        modules:
          - title: "AI World Park: gamified AI literacy assessment"
            text: "Students show what they know about AI by playing through a theme-park adventure, in Chinese or English"
            link: https://four-games-ten.vercel.app/
  - name: Higher education
    side: Pedagogical Prompting
    lessons: 1
    text: "One lesson teaching college students to prompt AI as a tutor, not a solution giver. Validated with 431 students."
    link: https://llm-prompt-builder.vercel.app/
    link_label: Try all four versions
    groups:
      - key: prompt
        name: Lightest to most engaging
        chip: Version
        modules:
          - title: "Brief reminder"
            text: "Read two sentences: use GenAI as a tutor, not a shortcut"
            meta: "< 1 min · +8 pts"
          - title: "Worked examples"
            text: "Read comics of a peer writing a learning-oriented prompt"
            meta: "~3 min · +39 pts"
          - title: "Component selection"
            text: "Pick the best option for each of six prompt components"
            meta: "~11 min · +45 pts"
          - title: "Select-then-write"
            text: "Write each component yourself, with AI feedback"
            meta: "~37 min · +51 pts, most durable"
  - name: Educators
    side: CMU Open Learning Initiative
    lessons: 1
    text: "Self-paced training that helps higher-education educators bring AI into their teaching."
    link: https://oli.cmu.edu/courses/ai-for-learning/
    link_label: View the course
    groups:
      - key: course
        name: Online course
        chip: Course
        modules:
          - title: "AI for Learning: Integrating AI into your teaching"
            text: "Recognize AI's capabilities and limits, apply prompt engineering, evaluate AI outputs, then build a chatbot for your own practice"
            meta: "87 educators · 214 chatbots"

  - name: Framework
    side: OECD AILit · 简体中文
    text: "A Simplified Chinese edition of the OECD and European Commission AI Literacy Framework, made by ActiveAI with Junyi Academy."
# 首页 Learning Design 的 Card view：左边介绍 + 右边一叠可点击切换的卡片（点后面的卡片标题把它翻到最前，左边介绍跟着换）。
# cards：label 是卡片左上角标签，tag 是右上角小字；title / text / audience / duration / format / gains_title / gains 是左边介绍；
# steps 是编号条目，kind 是条目下的小字；最后一行是链接（next / next_link），也用作左边的按钮；没有 next_link 时显示成不可点的灰色（如 Coming soon）。
deck:
  cards:
    - label: K–12
      tag: ActiveAI
      title: "AI literacy for K–12 classrooms"
      audience: "K–12 students and teachers"
      duration: "~15 min per module"
      format: "Online, interactive modules used in class"
      text: "19 interactive modules across the four competencies, mapped to the OECD/EC AI Literacy Framework."
      gains_title: Impact
      gains:
        - "Featured in the global Hour of AI activity catalog"
        - "3,000+ students across 150+ schools in Tainan"
        - "Taught in classrooms with Junyi Academy, Google, and Microsoft"
      steps:
        - title: Engage with AI
          kind: 7 modules
        - title: Create with AI
          kind: 4 modules
        - title: Manage AI
          kind: 4 modules
        - title: Shape AI
          kind: 4 modules
      next: Try ActiveAI
      next_link: https://app.active-ai.io/hour_of_ai
    - label: Higher education
      tag: Pedagogical Prompting
      title: "Teaching college students to prompt AI as a tutor"
      audience: "College students"
      duration: "Under 1 to ~37 min, by version"
      format: "Online lesson"
      text: "One lesson in four versions, from a two-sentence reminder to a hands-on writing exercise, so instructors can pick what fits their course."
      gains_title: Impact
      gains:
        - "Validated with 431 college students"
        - "Up to +51 pts with the select-then-write version"
        - "The lightest version takes under a minute"
      steps:
        - title: Brief reminder
          kind: "< 1 min"
        - title: Worked examples
          kind: "~3 min"
        - title: Component selection
          kind: "~11 min"
        - title: Select-then-write
          kind: "~37 min"
      next: Try all four versions
      next_link: https://llm-prompt-builder.vercel.app/
    - label: Workforce training
      tag: CMU OLI
      title: "Helping educators bring AI into their teaching"
      audience: "Higher-education educators"
      duration: "Self-paced"
      format: "Online course on CMU OLI"
      text: "Self-paced training on CMU's Open Learning Initiative: recognize AI's capabilities and limits, apply prompt engineering, evaluate AI outputs, then build a chatbot."
      gains_title: Impact
      gains:
        - "87 educators trained"
        - "214 chatbots built for their own practice"
        - "Free and self-paced on CMU OLI"
      steps:
        - title: AI capabilities and limits
          kind: Course unit
        - title: Prompt engineering
          kind: Course unit
        - title: Evaluating AI outputs
          kind: Course unit
        - title: Build your own chatbot
          kind: Course unit
      next: View the course
      next_link: https://oli.cmu.edu/courses/ai-for-learning/
    - label: Game-based assessment
      tag: AI World Park
      title: "Measuring AI literacy through play"
      audience: "K–12 students"
      duration: "One play session"
      format: "Browser game, in Chinese or English"
      text: "Students show what they know about AI by playing through a theme-park adventure instead of filling out a survey."
      gains_title: "Highlights:"
      gains:
        - "Playable in the browser, no install"
        - "Available in Chinese and English"
        - "Part of the ActiveAI K–12 program"
      steps:
        - title: AI World Park
          kind: Theme-park adventure game
        - title: Show what you know about AI
          kind: Assessment
        - title: Play in Chinese or English
          kind: Bilingual
      next: Play AI World Park
      next_link: https://four-games-ten.vercel.app/
    - label: Framework
      tag: OECD AILit · 简体中文
      title: "The AILit Framework in Simplified Chinese"
      text: "A Simplified Chinese edition of the OECD and European Commission AI Literacy Framework for primary and secondary education, for Chinese-speaking educators around the world."
      audience: "Educators and policymakers who read Simplified Chinese"
      duration: "Read at your own pace"
      format: "Free PDF, CC BY 4.0"
      gains_title: Highlights
      gains:
        - "Made by ActiveAI with Junyi Academy, building on its Traditional Chinese edition"
        - "Covers all 19 competences across the four domains"
        - "Free to share and adapt under CC BY 4.0"
      # editions：卡片里的概念图（原版 → 繁中 → 简中），代替 steps；cover 是封面图（中文版用设计交付包里的封面四格图），
      # 没有 cover 时显示 glyph 大字；title 里的 <em> 标出繁简不同的字
      editions:
        - lang: English
          by: OECD & European Commission
          cover: /assets/img/ailit-cover-en.jpg
          title: "Empowering Learners for the Age of AI"
        - lang: 繁體中文
          by: Junyi Academy
          cover: /assets/img/ailit-cover.jpg
          title: "<em>賦</em>能<em>學習</em>者迎向 AI <em>時</em>代"
        - lang: 简体中文
          by: ActiveAI × Junyi Academy
          cover: /assets/img/ailit-cover.jpg
          title: "<em>赋</em>能<em>学习</em>者迎向 AI <em>时</em>代"
          soon: true
      next: Coming soon


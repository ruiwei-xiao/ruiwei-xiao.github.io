# Synced with Google Scholar (scholar.google.com/citations?user=izYxC3EAAAAJ), newest first.
#
# venue:      short label shown on the card ("CHI 2026")
# venue_full: full venue, shown on the publications page
# authors:    plain text; "Ruiwei Xiao" is highlighted automatically
# topics:     small colored dots on the card (see .topic-* in style.css)
# project:    activeai | prompting — used by the publications page filters
# role:       1st | co-1st | co — used by the "1st author" filter
# group:      literacy | aied | workshop — 论文页（full list）只显示有 group 的论文
# featured:   同时显示在首页，按 group 分块
# date:       用于排序（新到旧）；会议论文用会议日期，预印本用大致时间
# mentees:    你指导的学生（作者全名列表），作者列表里显示为绿色，链接见 mentees.yml
# award:      optional badge, e.g. "Best Paper Honorable Mention" or "Oral Presentation"
# image:      optional teaser; cards without one get a soft placeholder
# links:      any of paper, code, dataset, project, poster, slides, website（paper 只用作标题链接，不显示按钮）


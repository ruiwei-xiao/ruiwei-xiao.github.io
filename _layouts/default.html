<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 深浅色：先读用户选择，没有则跟随系统；放在 head 里避免闪白 -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>

<body>
  <!-- 顶部导航：滚动到首页对应版块；当前版块高亮 -->
  <nav class="nav">
    <div class="wrap">
      <a href="{{ '/' | relative_url }}" class="logo">ruiwei<i>.</i>xiao</a>
      <div class="nav-right">
        <div class="links">
          <a href="{{ '/#publications' | relative_url }}" data-go="publications"{% if page.url == '/publications/' %} class="on"{% endif %}><span class="full">Publications</span><span class="short">Papers</span></a>
          <a href="{{ '/#learning-design' | relative_url }}" data-go="learning-design"><span class="full">Learning Design</span><span class="short">Design</span></a>
          <a href="{{ site.cv_url }}" target="_blank" class="hide-sm">CV</a>
        </div>
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="wrap">
    {{ content }}
  </main>

  {% if site.under_construction %}
  <!-- 施工中蒙版：模糊遮住整站；点 "Take a peek" 本次会话内隐藏（_config.yml 的 under_construction 控制开关） -->
  <div class="uc" role="dialog" aria-modal="true" aria-labelledby="uc-title">
    <div class="uc-card">
      <svg class="uc-icon" viewBox="0 0 24 24"><path d="M2 20h20M5 20V9l7-5 7 5v11M9 20v-6h6v6"/></svg>
      <h2 id="uc-title">Under construction</h2>
      <p>This site is being redesigned. Please check back soon.</p>
      <button class="uc-peek" type="button">Take a peek →</button>
    </div>
  </div>
  <script>try { if (sessionStorage.getItem('uc-peek')) document.documentElement.classList.add('uc-off'); } catch (e) {}</script>
  {% endif %}

  <footer>© {{ site.time | date: '%Y' }} Ruiwei Xiao</footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>

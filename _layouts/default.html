<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  <!-- 顶部导航：首页上点击切换身份；其他页面跳回首页对应身份 -->
  <nav class="nav">
    <div class="wrap">
      <a href="{{ '/' | relative_url }}" class="logo">ruiwei<i>.</i>xiao</a>
      <div class="links">
        <a href="{{ '/#research' | relative_url }}" data-go="research"{% if page.url == '/publications/' %} class="on"{% endif %}>Research</a>
        <a href="{{ '/#practice' | relative_url }}" data-go="practice">Practice</a>
        <a href="{{ '/#life' | relative_url }}" data-go="life">Life</a>
        <a href="{{ site.cv_url }}" target="_blank" class="hide-sm">CV</a>
      </div>
    </div>
  </nav>

  <main class="wrap">
    {{ content }}
  </main>

  <footer>© {{ site.time | date: '%Y' }} Ruiwei Xiao</footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
